<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather-App</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="imgs/AppICon.png" />
  </head>
  <body>

    <div id="header">
      <div>
        <img src="imgs/AppICon.png" alt="AppICon"/>
        <h1>Weather-App</h1>
      </div>
      <div class="switch-container">
        <span class="unit active" id="celsiusLabel">°C</span>
        <label class="switch">
          <input type="checkbox" id="unitSwitch" checked/>
          <span class="slider"></span>
        </label>
        <span class="unit" id="fahrenheitLabel">°F</span>
      </div>
    </div>

    <div id="searchBar">
      <input type="text" id="cityInput" placeholder="Enter city name..." />
      <button type="submit" id="searchBtn"><img src="./imgs/magnify.svg" alt="" class="searchLogo"></button>
    </div>

    <div id="loading" style="display: none;">
      <img src="imgs/ripples.svg" alt="Loading...">
    </div>

    <div id="mainForcast">
      <h2 id="cityTitle"></h2>
      <h4 id="todaysDate"></h4>
      <p id="currentTemp"></p>
      <p id="currnetCondition"></p>
      <div id="currentOthers">
        <div class="feelsLike othersElement">
          <img src="imgs/science.png" alt="feelslike" class="icon" />
          <span class="label">Feels Like</span>
          <span class="value"></span>
        </div>
        <div class="humidity othersElement">
          <img src="imgs/water.png" alt="feelslike" class="icon" />
          <span class="label">Humidity</span>
          <span class="value"></span>
        </div>
        <div class="windSpeed othersElement">
          <img src="imgs/direction.png" alt="feelslike" class="icon" />
          <span class="label">Wind Speed</span>
          <span class="value"></span>
        </div>
        <div class="pressure othersElement">
          <img src="imgs/hussicane.png" alt="feelslike" class="icon" />
          <span class="label">Pressure</span>
          <span class="value"></span>
        </div>
        <div class="UVIndex othersElement">
          <img src="imgs/science.png" alt="feelslike" class="icon" />
          <span class="label">UV Index</span>
          <span class="value"></span>
        </div>
        <div class="visibility othersElement">
          <img src="imgs/circle.png" alt="feelslike" class="icon" />
          <span class="label">Visibility</span>
          <span class="value"></span>
        </div>
      </div>
    </div>


    <p id="fiveDayForcastText">5-Day Forcast</p>
    <div id="fiveDayForcast">
      <div class="dayForcast day1">
        <span class="day">Sun</span>
        <img class="dayImg day1Img" src="imgs/clear.png" alt="">
        <span class="temp"></span>
        <span class="condition"></span>
        <span class="highLow"></span>
      </div>
      <div class="dayForcast day2">
        <span class="day">Sun</span>
        <img class="dayImg day2Img" src="imgs/clear.png" alt="">
        <span class="temp"></span>
        <span class="condition"></span>
        <span class="highLow"></span>
      </div>
      <div class="dayForcast day3">
        <span class="day">Sun</span>
        <img class="dayImg day3Img" src="imgs/clear.png" alt="">
        <span class="temp"></span>
        <span class="condition"></span>
        <span class="highLow"></span>
      </div>
      <div class="dayForcast day4">
        <span class="day">Sun</span>
        <img class="dayImg day4Img" src="imgs/clear.png" alt="">
        <span class="temp"></span>
        <span class="condition"></span>
        <span class="highLow"></span>
      </div>
      <div class="dayForcast day5">
        <span class="day">Sun</span>
        <img class="dayImg day5Img" src="imgs/clear.png" alt="">
        <span class="temp"></span>
        <span class="condition"></span>
        <span class="highLow"></span>
      </div>
    </div>


    <p id="weatherDetailsText">Weather Details</p>
    <div id="weatherDetails">
      <div class="sunrise weatherDetail">
        <img src="imgs/sun.png" alt="">
        <span>Sunrise</span>
        <span></span>
      </div>
      <div class="sunset weatherDetail">
        <img src="imgs/down.png" alt="">
        <span>Sunset</span>
        <span></span>
      </div>
      <div class="chanceOfRain weatherDetail">
        <img src="imgs/rain.png" alt="">
        <span>Chance Of Rain</span>
        <span></span>
      </div>
      <div class="cloudCover weatherDetail">
        <img src="imgs/cloud.png" alt="">
        <span>Cloud Cover</span>
        <span></span>
      </div>
    </div>


    <div id="footer">
      <p>
        © 2025 <a href="https://github.com/HasanAlii73">hsn73</a> All rights
        reserved.
      </p>
      <p>weather data provided by VisulaCrossing</p>
    </div>

    <!-- https://mutopia7.github.io/weather/ -->
    <!-- https://github.com/mutopia7/weather -->

    <script src="index.js"></script>
  </body>
</html>
